<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 08 — Peripherals &amp; Space: Mic In, Delay &amp; Reverb</title>
<style>
  body { margin: 0; background: #161616; color: #dcdcdc; font: 12px/1.5 ui-monospace, monospace; display: grid; place-items: center; height: 100vh; }
  .box { background: #212121; border: 1px solid #383838; padding: 12px; width: 520px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  input[type="range"] { width: 280px; accent-color: #ff9900; }
  button { background: #292929; color: #dcdcdc; border: 1px solid #383838; padding: 6px 10px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="row">
    <span>STEP 08 // MIC IN, DELAY ECHO &amp; CONVOLUTION REVERB</span>
    <div>
      <button id="btnPulse">PING PULSE</button>
      <button id="btnMic">ENABLE MIC</button>
    </div>
  </div>
  <div class="row">
    <label>1. DELAY TIME S (<span id="lblDel">0.32</span>)</label>
    <input type="range" id="rngDel" min="0.05" max="1.0" step="0.01" value="0.32">
  </div>
  <div class="row">
    <label>2. DELAY FEEDBACK (<span id="lblFb">0.55</span>)</label>
    <input type="range" id="rngFb" min="0" max="0.88" step="0.01" value="0.55">
  </div>
  <div class="row">
    <label>3. REVERB MIX (<span id="lblRev">0.60</span>)</label>
    <input type="range" id="rngRev" min="0" max="1.2" step="0.01" value="0.60">
  </div>
</div>

<script>
/* ============================================================================
 * INTERNET MUSIC — STEP 08: PERIPHERALS (MIC) & SPATIAL FX (DELAY + REVERB)
 * Concepts: [[getUserMedia]], [[DelayNode]], [[ConvolverNode]], Impulse Response
 * ============================================================================ */

let ctx = null, inputBus = null, delay = null, fbGain = null, revGain = null;

function initSpaceEngine() {
  if (ctx) return;
  ctx = new AudioContext();
  inputBus = ctx.createGain(); // Shared input for Test Pulse and Microphone

  // 1. Delay with Feedback loop: inputBus -> delay -> fbGain -> delay
  delay = ctx.createDelay(2.0);
  fbGain = ctx.createGain();
  delay.delayTime.value = 0.32;
  fbGain.gain.value = 0.55;
  inputBus.connect(delay);
  delay.connect(fbGain).connect(delay);
  delay.connect(ctx.destination);

  // 2. Convolution Reverb using a synthetic decaying noise Impulse Response
  const convolver = ctx.createConvolver();
  const len = ctx.sampleRate * 2.5;
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
  }
  convolver.buffer = ir;
  revGain = ctx.createGain();
  revGain.gain.value = 0.60;

  // Send both dry input and delayed echoes into the reverb
  inputBus.connect(convolver);
  delay.connect(convolver);
  convolver.connect(revGain).connect(ctx.destination);
  inputBus.connect(ctx.destination);
}

// Trigger a short percussive synth ping into the Delay + Reverb space
document.getElementById('btnPulse').onclick = () => {
  initSpaceEngine();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const env = ctx.createGain();
  osc.frequency.setValueAtTime(520, now);
  osc.frequency.exponentialRampToValueAtTime(130, now + 0.12);
  env.gain.setValueAtTime(0.4, now);
  env.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  osc.connect(env).connect(inputBus);
  osc.start(now);
  osc.stop(now + 0.16);
};

// Connect live Microphone peripheral via navigator.mediaDevices.getUserMedia
document.getElementById('btnMic').onclick = async () => {
  initSpaceEngine();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  ctx.createMediaStreamSource(stream).connect(inputBus);
  document.getElementById('btnMic').textContent = 'MIC LIVE';
};

document.getElementById('rngDel').oninput = (e) => {
  initSpaceEngine();
  delay.delayTime.setTargetAtTime(+e.target.value, ctx.currentTime, 0.03);
  document.getElementById('lblDel').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('rngFb').oninput = (e) => {
  initSpaceEngine();
  fbGain.gain.setTargetAtTime(+e.target.value, ctx.currentTime, 0.02);
  document.getElementById('lblFb').textContent = (+e.target.value).toFixed(2);
};
document.getElementById('rngRev').oninput = (e) => {
  initSpaceEngine();
  revGain.gain.setTargetAtTime(+e.target.value, ctx.currentTime, 0.02);
  document.getElementById('lblRev').textContent = (+e.target.value).toFixed(2);
};
</script>
</body>
</html>
