<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 05 — Subtractive Synthesis: Sawtooth &amp; Resonant Filter</title>
<style>
  body { margin: 0; background: #161616; color: #dcdcdc; font: 12px/1.5 ui-monospace, monospace; display: grid; place-items: center; height: 100vh; }
  .box { background: #212121; border: 1px solid #383838; padding: 12px; width: 520px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  input[type="range"] { width: 320px; accent-color: #ff9900; }
  button { background: #292929; color: #dcdcdc; border: 1px solid #383838; padding: 6px 12px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="row">
    <span>STEP 05 // SUBTRACTIVE SYNTHESIS (FILTER + LFO)</span>
    <button id="btnStart">START AUDIO</button>
  </div>
  <div class="row">
    <label>1. SAWTOOTH PITCH HZ (<span id="lblPitch">82</span>)</label>
    <input type="range" id="rngPitch" min="40" max="330" value="82">
  </div>
  <div class="row">
    <label>2. FILTER CUTOFF HZ (<span id="lblCutoff">650</span>)</label>
    <input type="range" id="rngCutoff" min="60" max="5000" value="650">
  </div>
  <div class="row">
    <label>3. RESONANCE Q (<span id="lblQ">6.0</span>)</label>
    <input type="range" id="rngQ" min="0.5" max="20" step="0.1" value="6.0">
  </div>
</div>

<script>
/* ============================================================================
 * INTERNET MUSIC — STEP 05: SUBTRACTIVE SYNTHESIS & BIQUAD FILTER
 * Concepts: [[subtractive-synthesis]], [[BiquadFilterNode]], Cutoff & Resonance Q
 * Principle: Start with a bright waveform rich in harmonics ('sawtooth') and
 *            carve away high frequencies using a resonant low-pass filter.
 * ============================================================================ */

let ctx = null;
let sawOsc = null;
let filter = null;

function initSubtractiveSynth() {
  if (ctx) return;
  ctx = new AudioContext();

  // 1. Source: Sawtooth oscillator (contains all integer harmonics 1/n)
  sawOsc = ctx.createOscillator();
  sawOsc.type = 'sawtooth';

  // 2. Processor: Resonant Low-Pass [[BiquadFilterNode]]
  filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';

  // 3. Modulator: Slow LFO gently moving the filter cutoff (+- 120 Hz at 0.5 Hz)
  const lfo = ctx.createOscillator();
  const lfoDepth = ctx.createGain();
  lfo.frequency.value = 0.5;
  lfoDepth.gain.value = 120;
  lfo.connect(lfoDepth).connect(filter.frequency);

  // 4. Master output gain
  const amp = ctx.createGain();
  amp.gain.value = 0.3;

  // Wire graph: Sawtooth -> Filter -> Amp -> Destination
  sawOsc.connect(filter).connect(amp).connect(ctx.destination);

  sawOsc.start();
  lfo.start();
  updateSubtractiveParams();
  document.getElementById('btnStart').textContent = 'RUNNING';
}

function updateSubtractiveParams() {
  const pitch = parseFloat(document.getElementById('rngPitch').value);
  const cutoff = parseFloat(document.getElementById('rngCutoff').value);
  const q = parseFloat(document.getElementById('rngQ').value);

  document.getElementById('lblPitch').textContent = Math.round(pitch);
  document.getElementById('lblCutoff').textContent = Math.round(cutoff);
  document.getElementById('lblQ').textContent = q.toFixed(1);

  if (!ctx) return;
  sawOsc.frequency.setTargetAtTime(pitch, ctx.currentTime, 0.02);
  filter.frequency.setTargetAtTime(cutoff, ctx.currentTime, 0.02);
  filter.Q.setTargetAtTime(q, ctx.currentTime, 0.02);
}

document.getElementById('btnStart').onclick = initSubtractiveSynth;
['rngPitch', 'rngCutoff', 'rngQ'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    initSubtractiveSynth();
    updateSubtractiveParams();
  });
});
</script>
</body>
</html>
